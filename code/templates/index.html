{% extends 'base.html' %}

{% block head %} 
<h1>Dashboard</h1>
{% endblock %}

{% block body %} 
<h2>Add Task</h2>
<form action="/add-task" method="POST">
    <label>Task Name:</label>
    <input type="text" name="task_name" required>

    <label>Date:</label>
    <input type="date" name="task_date" required>

    <label>Time:</label>
    <input type="time" name="task_time" required>

    <button type="submit" title="Save Task">
        <!-- Draws Floppy Disk Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
    </button>
</form>

<hr>

<h2>Upcoming Tasks</h2>
<ul>
    {% for task in tasks %}
        <li data-task-id="{{ task.id }}" data-deadline="{{ task.deadline.isoformat() }}">
            <span class="task-text">{{ task.name }} - {{ task.deadline.strftime('%Y-%m-%d %I:%M %p') }}</span>
            
            <a href="/edit/{{ task.id }}" class="edit-btn" title="Edit Task">
                <!-- Draws Pencil Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </a>

            <form action="/delete/{{ task.id }}" method="POST" style="display:inline;">
                <button type="submit" class="done-btn" title="Mark as Done">
                    <!-- Draws Check Mark -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </form>
        </li>
    {% endfor %}
</ul>
{% endblock %}
