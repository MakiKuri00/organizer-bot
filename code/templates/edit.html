{% extends 'base.html' %}

{% block head %}
<h1>Edit Task</h1>
{% endblock %}

{% block body %}
<form action="/edit/{{ task.id }}" method="POST">
    <label>Task Name</label>
    <input type="text" name="task_name" value="{{ task.name }}" required>

    <label>Date:</label>
    <input type="date" name="task_date" value="{{ task.deadline.strftime('%Y-%m-%d') }}" required>

    <label>Time:</label>
    <input type="time" name="task_time" value="{{ task.deadline.strftime('%H:%M') }}" required>

    <button type="submit" title="Save Changes">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
    </button>
</form>

<a href="/">Cancel</a>
{% endblock %}
